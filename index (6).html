<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniversário da Ayla Sophia</title>
<style>
:root{box-sizing:border-box;--pink:#b02a78;--pink2:#7d1d63;--green:#2e9e4f;--green2:#1d7436;--red:#d9503f;--red2:#a63326}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#1d3a1a;font-family:"Trebuchet MS",system-ui,sans-serif}
.blur{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(20px) brightness(.8);transform:scale(1.1)}
.stage{position:absolute;left:50%;top:calc(50% + (env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 2);transform:translate(-50%,-50%);--h:min(calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px),calc((100vw - 8px) * 1.5009));height:var(--h);width:calc(var(--h) * .6663);container-type:inline-size;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.head{position:absolute;top:1cqw;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.head .n{width:80%}.head .a{width:40%;margin-top:-1cqw}
.panel{position:absolute;left:5cqw;right:5cqw;bottom:3cqw;padding:3cqw;border-radius:6cqw;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);box-shadow:0 2cqw 6cqw rgba(0,0,0,.3);display:grid;gap:2.2cqw}
.panel h2{margin:0;text-align:center;font-size:clamp(14px,4.4cqw,22px);color:var(--pink2)}
input{width:100%;font:inherit;font-size:clamp(16px,4.6cqw,22px);padding:3cqw 4cqw;border:.6cqw solid #e2bdd6;border-radius:4cqw;outline:none;background:#fff}
input:focus{border-color:var(--pink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.btn{font:inherit;font-weight:700;font-size:clamp(15px,4.4cqw,21px);color:#fff;border:0;border-radius:4cqw;padding:3.2cqw 2cqw;cursor:pointer;transition:transform .12s,box-shadow .12s,filter .2s;touch-action:manipulation}
.yes{background:var(--green);box-shadow:0 1.4cqw 0 var(--green2)}
.no{background:var(--red);box-shadow:0 1.4cqw 0 var(--red2)}
.go{background:var(--pink);box-shadow:0 1.6cqw 0 var(--pink2);font-size:clamp(16px,5cqw,24px);animation:pulse 1.8s infinite}
.btn:active{transform:translateY(1.2cqw) scale(.94);box-shadow:0 .2cqw 0 rgba(0,0,0,.3)}
.btn.sel{outline:1cqw solid #ffd23f;outline-offset:.4cqw;transform:scale(1.04)}
.row.dim .btn:not(.sel){filter:grayscale(.7) opacity(.65)}
@keyframes pulse{50%{transform:scale(1.035)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-2cqw)}75%{transform:translateX(2cqw)}}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,10,40,.7);z-index:20;padding:20px}
.ov.on{display:flex}
.card{width:min(86vw,340px);background:#fff;border-radius:28px;padding:16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.pic{width:100%;aspect-ratio:1;border-radius:20px;background-size:100%;background-position:50% 60%;animation:bob 1.2s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-6px) rotate(1.5deg)}}
.card h3{margin:12px 0 4px;font-size:30px;color:var(--pink2)}
.card p{margin:0 0 10px;color:#555}
.card a{display:inline-block;background:#25d366;color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:14px}
.c{position:fixed;top:-20px;width:10px;height:14px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>

<section class="panel" id="panel">
<h2>Você vem à festa? 🎈</h2>
<input id="nome" placeholder="Seu nome" autocomplete="name">
<div class="row" id="row">
<button class="btn yes" data-v="yes">Eu vou! 🎉</button>
<button class="btn no" data-v="no">Não poderei ir 😢</button>
</div>

</main>
<div class="ov" id="ov"><div class="card">
<div class="pic" id="pic"></div>
<h3>Feito! ✅</h3><p>Abrindo o WhatsApp…</p>
<a id="wa" href="#" target="_blank" rel="noopener">Abrir WhatsApp</a>
</div></div>
<script>
const WHATSAPP="5585996908608"; // número com DDI+DDD, só dígitos
const bg=document.getElementById("bg").src;
document.getElementById("blur").style.backgroundImage="url("+bg+")";
document.getElementById("pic").style.backgroundImage="url("+bg+")";
let choice=null;
const $=id=>document.getElementById(id);
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
document.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>{
 choice=b.dataset.v;
 document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("sel",x===b));
 $("row").classList.add("dim");
}));
function confetti(){
 const cols=["#b02a78","#ffd23f","#2e9e4f","#d9503f","#4aa3ff"];
 for(let i=0;i<60;i++){const d=document.createElement("div");d.className="c";
  d.style.left=Math.random()*100+"vw";d.style.background=cols[i%5];
  d.style.animationDuration=(2+Math.random()*2)+"s";d.style.animationDelay=Math.random()*.6+"s";
  document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}
}
$("go").addEventListener("click",()=>{
 const nome=$("nome").value.trim();
 if(!nome){shake($("nome"));$("nome").focus();return}
 if(!choice){shake($("row"));return}
 const msg=choice==="yes"
  ?`Olá! Aqui é ${nome}. Confirmo minha presença no aniversário de 2 aninhos da Ayla Sophia! 🎉`
  :`Olá! Aqui é ${nome}. Infelizmente não poderei comparecer ao aniversário da Ayla Sophia, mas mando um beijo! 💜`;
 const url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
 $("wa").href=url;$("ov").classList.add("on");confetti();
 setTimeout(()=>{window.open(url,"_blank")||(location.href=url)},2200);
});
</script></body></html>
